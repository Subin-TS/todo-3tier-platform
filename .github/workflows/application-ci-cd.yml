name: Application CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_BACKEND_REPOSITORY: todo-backend
  ECR_FRONTEND_REPOSITORY: todo-frontend

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: "3306"
      DB_NAME: test
      DB_USER: test
      DB_PASSWORD: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::275839157288:role/todo-staging-github-actions-app
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: image
        run: |
          echo "registry=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            -t ${{ steps.image.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ steps.image.outputs.tag }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ steps.image.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ steps.image.outputs.tag }} \
            ./frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ steps.image.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Push backend image
        run: |
          docker push \
            ${{ steps.image.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ steps.image.outputs.tag }}

      - name: Push frontend image
        run: |
          docker push \
            ${{ steps.image.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ steps.image.outputs.tag }}

      - name: Update staging image tags
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import os

          path = Path("helm/todo-app/values-staging.yaml")
          text = path.read_text()

          lines = text.splitlines()
          current_image = None
          output = []

          for line in lines:
              stripped = line.strip()

              if stripped == "frontend:":
                  current_image = "frontend"
              elif stripped == "backend:":
                  current_image = "backend"
              elif stripped.startswith("image:"):
                  current_image = current_image
              elif stripped.startswith("tag:") and current_image in {"frontend", "backend"}:
                  indent = line[:len(line) - len(line.lstrip())]
                  line = f'{indent}tag: {os.environ["GITHUB_SHA"]}'
                  current_image = None

              output.append(line)

          path.write_text("\n".join(output) + "\n")
          PYTHON

      - name: Commit updated staging image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/todo-app/values-staging.yaml
          git commit -m "chore: update staging image tags [skip ci]" || echo "No image tag changes to commit"
          git push
