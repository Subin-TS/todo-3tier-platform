name: Application CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_BACKEND_REPOSITORY: todo-backend
  ECR_FRONTEND_REPOSITORY: todo-frontend

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::275839157288:role/todo-staging-github-actions-app
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: image
        run: |
          echo "registry=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            -t ${{ steps.image.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ steps.image.outputs.tag }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ steps.image.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ steps.image.outputs.tag }} \
            ./frontend

      - name: Push backend image
        run: |
          docker push \
            ${{ steps.image.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ steps.image.outputs.tag }}

      - name: Push frontend image
        run: |
          docker push \
            ${{ steps.image.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ steps.image.outputs.tag }}
