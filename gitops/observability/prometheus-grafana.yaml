apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 91.8.2
    helm:
      valuesObject:
        grafana:
          enabled: true
          replicas: 1

        prometheus:
          enabled: true
          prometheusSpec:
            replicas: 1

        alertmanager:
          enabled: true
          alertmanagerSpec:
            replicas: 1

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
